# ai-written
#
# Reporting items for a continuously republished outbreak estimate.
#
# This is not a new reporting guideline. It is a local implementation of
# GATHER, EPIFORGE and ISPOR-SMDM Task Force-7 for a report that is rebuilt
# and republished on every data update, plus the items those guidelines do
# not carry because they assume a document published once.
#
# Each item states a checkable assertion about the report, says which of the
# two documents it belongs to, names its source, and records whether the
# BVDOutbreakSize summary page satisfies it today.

meta:
  version: 0.1.0
  status: draft
  scored_against:
    repo: epiforecasts/BVDOutbreakSize
    page: docs/src/summary.md
    main: 582537a2
    reporting: 701e5488
    scored_on: 2026-09-21
    note: >
      Scored against the reporting branch (open PR #782), which reorganises
      this page. Where main differs the note says so.

  audience:
    primary: >
      A technically literate responder or analyst, at INSP, WHO, an NGO or a
      partner agency, who works with outbreak data but does not build models.
    secondary: [modelling peers, press]
    source: >
      Matches GATHER's own split into decision makers, who need assumptions
      and limitations without advanced statistical training, and researchers,
      who need enough detail to reproduce.

  documents:
    non_technical: >
      One page for the primary reader. ISPOR-7 requires this be available to
      anyone. In BVDOutbreakSize this is the summary page.
    technical: >
      Methods, evaluation and diagnostics, sufficient for a peer to reproduce.
      In BVDOutbreakSize this is the analysis and sensitivity pages.

  sources:
    GATHER: >
      Stevens et al. 2016, PLOS Medicine 13(6):e1002056. 18 items for
      reporting population health estimates. Item numbers are GATHER's own.
    EPIFORGE: >
      Pollett et al. 2021, PLOS Medicine 18(10):e1003793. 19 items for
      epidemic forecasting and prediction research, Delphi with 46 panellists.
    ISPOR7: >
      Eddy et al. 2012, ISPOR-SMDM Modeling Good Research Practices Task
      Force-7. Splits documentation into non-technical and technical.
    ORBIT: >
      Gregoire et al. 2026, Public Health. 9 items, Delphi, for surveillance
      counts an authority publishes. Contains no item on model estimates, so
      it bounds this checklist rather than overlapping it.
    WHO_RRA: >
      WHO Rapid Risk Assessment template v2.1. Source of the confidence-level
      and immediate-actions fields.
    TRACE: >
      Grimm et al. 2014, Ecological Modelling 280:129-139. Eight elements of
      model documentation as evidence of fitness for purpose.
    none: >
      No published source found. Ours, and labelled as such.

  fields:
    id: Stable. Never renumber; retire instead.
    requirement: A checkable assertion about the report.
    document: non_technical or technical.
    reader: Who the item serves.
    source: Citation keys, with item numbers where the source numbers them.
    check: auto if a machine can verify it from the page, else manual.
    realtime: >
      true where the item exists because the report is republished. These are
      the items the source guidelines do not carry.
    bos: pass, partial or fail.

items:

  - id: OR-01
    name: Purpose and intended use
    requirement: >
      The report states what the estimate is for and which decisions it is
      intended to support.
    document: non_technical
    reader: [responder, press]
    source: [GATHER-1, EPIFORGE-2, ISPOR7]
    check: manual
    realtime: false
    bos: fail
    bos_note: >
      PR 782 adds aim.md, but the summary page neither states a purpose nor
      links to it. On main there is no such page at all.

  - id: OR-02
    name: Quantities defined before use
    requirement: >
      Every reported quantity is defined in words before its first number,
      including the population and geography it covers.
    document: non_technical
    reader: [responder, press]
    source: [GATHER-1]
    check: manual
    realtime: false
    bos: fail
    bos_note: >
      The reproduction number is defined at line 76 and used at lines 42, 44
      and 45. Ascertainment is used at lines 44 and 45 and in a table column
      and never defined. Data stream is used at lines 99-103 and never
      defined.

  - id: OR-03
    name: Data cut-off
    requirement: >
      The report states the date the data were current to, and which
      situation report or release that corresponds to.
    document: non_technical
    reader: [responder, peer, press]
    source: [GATHER-1, EPIFORGE-4]
    check: auto
    realtime: true
    bos: partial
    bos_note: >
      A Data as of date is rendered at the top from cutoff.md. The source
      report it corresponds to is not named on the page.

  - id: OR-04
    name: Update cadence
    requirement: >
      The report states how often it is updated and when the next update is
      due.
    document: non_technical
    reader: [responder, press]
    source: [none]
    check: manual
    realtime: true
    bos: fail
    bos_note: >
      The README says the report is re-run as new data arrive. The summary
      page says nothing, so a reader cannot tell whether a number is hours or
      weeks old relative to its cadence.

  - id: OR-05
    name: Change since the last update
    requirement: >
      The report states how the headline estimate has changed since the
      previous version, and why it changed.
    document: non_technical
    reader: [responder, peer, press]
    source: [GATHER-17]
    check: manual
    realtime: true
    bos: fail
    bos_note: >
      The sensitivity page plots estimate evolution across releases. The
      summary page carries neither the change nor the reason for it. GATHER
      17 asks for the reason, not only the series.

  - id: OR-06
    name: Headline estimate with one interval
    requirement: >
      Each headline quantity is given with a single uncertainty interval,
      whose meaning is stated in words at or before first use.
    document: non_technical
    reader: [responder, press]
    source: [GATHER-16, EPIFORGE-14]
    check: manual
    realtime: false
    bos: fail
    bos_note: >
      Three interval levels per quantity, nested on one line, generated in
      analysis.jl lines 2341-2366. The levels are named at line 38, after two
      tables have already used them, and the sentence claiming all intervals
      are 30/60/90 is contradicted at line 43.

  - id: OR-07
    name: Non-technical summary of results
    requirement: >
      The report summarises the results in non-technical terms, including a
      non-technical interpretation of the uncertainty.
    document: non_technical
    reader: [responder, press]
    source: [EPIFORGE-15, ISPOR7]
    check: manual
    realtime: false
    bos: fail
    bos_note: >
      The headline is seven bullets of the form "Label: the X is estimated to
      have been A, B, C", assembled by string interpolation. No prose
      interpretation of the uncertainty appears anywhere on the page.

  - id: OR-08
    name: Data sources named
    requirement: >
      The report names each data source, who produces it, and the period it
      covers.
    document: non_technical
    reader: [responder, peer]
    source: [GATHER-5, ORBIT]
    check: manual
    realtime: false
    bos: fail
    bos_note: >
      Streams are named but never sourced on the page. Line 6 points at a
      repository file rather than a link a web reader can follow.

  - id: OR-09
    name: Known biases in the inputs
    requirement: >
      The report identifies which input data carry potentially important
      biases.
    document: non_technical
    reader: [responder, peer]
    source: [GATHER-6]
    check: manual
    realtime: false
    bos: partial
    bos_note: >
      Under-ascertainment is modelled and its consequence is stated at line
      90. It is not named as a bias in the inputs, and the reduced-stream
      periods are not flagged on the page.

  - id: OR-10
    name: Sources of uncertainty included and excluded
    requirement: >
      The report states which sources of uncertainty the intervals account
      for, and which they do not.
    document: non_technical
    reader: [responder, peer]
    source: [GATHER-13]
    check: manual
    realtime: false
    bos: fail
    bos_note: Absent from the summary page.

  - id: OR-11
    name: Predictive performance
    requirement: >
      Where the report forecasts, it states how its previous forecasts
      performed, against a named comparator.
    document: non_technical
    reader: [responder, peer]
    source: [EPIFORGE-11, EPIFORGE-12]
    check: manual
    realtime: true
    bos: fail
    bos_note: >
      Forecast validation and baseline scoring exist on the sensitivity page.
      The summary page shows sampler diagnostics instead, which are not
      evidence that the model predicts well.

  - id: OR-12
    name: Limitations
    requirement: >
      The report states its limitations, including the modelling assumptions
      and data limitations that affect interpretation.
    document: non_technical
    reader: [responder, peer, press]
    source: [GATHER-18, EPIFORGE-17, ISPOR7]
    check: manual
    realtime: false
    bos: fail
    bos_note: >
      PR 782 moves limitations to their own page. The summary page does not
      link it.

  - id: OR-13
    name: Confidence statement
    requirement: >
      The report states in one sentence of plain language how much confidence
      to place in the headline estimate.
    document: non_technical
    reader: [responder, press]
    source: [WHO_RRA]
    check: manual
    realtime: false
    bos: fail
    bos_note: >
      The page offers a diagnostics table defining R-hat, bulk effective
      sample size and divergent transitions. That is sampler behaviour, and
      it asks the reader to form their own judgement from quantities they
      have just been taught.

  - id: OR-14
    name: Implications for action
    requirement: >
      The report comments on what its results imply for public health action
      and decision-making.
    document: non_technical
    reader: [responder]
    source: [EPIFORGE-18, WHO_RRA]
    check: manual
    realtime: false
    bos: fail
    bos_note: Absent. The page ends on a per-stream comparison.

  - id: OR-15
    name: Estimates available as data
    requirement: >
      The published estimates are downloadable in a format data can be
      extracted from, carrying a version or timestamp.
    document: non_technical
    reader: [responder, peer]
    source: [GATHER-15, EPIFORGE-16]
    check: auto
    realtime: true
    bos: partial
    bos_note: >
      Every push publishes CSVs, draws and a versioned release. The summary
      page does not link them.

  - id: OR-16
    name: Code available
    requirement: The analysis code is accessible, and the report says where.
    document: non_technical
    reader: [peer]
    source: [GATHER-14, EPIFORGE-9]
    check: auto
    realtime: false
    bos: pass
    bos_note: Footer links the repository.

  - id: OR-17
    name: Authorship and funding
    requirement: The report names its authors and its funding sources.
    document: non_technical
    reader: [responder, press]
    source: [GATHER-2, ISPOR7]
    check: auto
    realtime: false
    bos: partial
    bos_note: >
      PR 782 adds an authors and funding page. The summary page does not link
      it.

  - id: OR-18
    name: Contact and feedback route
    requirement: >
      The report says how to raise a correction or a question, and with whom.
    document: non_technical
    reader: [responder, peer, press]
    source: [none]
    check: manual
    realtime: false
    bos: partial
    bos_note: >
      The footer links the repository. Nothing names a person or a route for
      a reader who does not use GitHub.

  - id: OR-19
    name: Methods sufficient to reproduce
    requirement: >
      The technical document describes every step of the analysis, including
      the mathematics, in enough detail to reproduce it.
    document: technical
    reader: [peer]
    source: [GATHER-10, EPIFORGE-3, ISPOR7, TRACE]
    check: manual
    realtime: false
    bos: pass
    bos_note: The analysis page carries a full generative methods section.

  - id: OR-20
    name: Model evaluation and comparison
    requirement: >
      The technical document reports how the model was evaluated and how it
      compares with other published estimates.
    document: technical
    reader: [peer]
    source: [GATHER-11, GATHER-12, EPIFORGE-10, TRACE]
    check: manual
    realtime: false
    bos: pass
    bos_note: >
      The sensitivity page carries forecast validation and comparisons with
      McCabe et al. and Chamla et al.

  - id: OR-21
    name: Inference diagnostics stay technical
    requirement: >
      Sampler diagnostics do not appear in the non-technical document.
    document: technical
    reader: [peer]
    source: [ISPOR7]
    check: auto
    realtime: false
    bos: fail
    bos_note: >
      R-hat, bulk effective sample size and divergent transitions are on the
      summary page at lines 53-72, with definitions. PR 782 folds them into a
      dropdown, which hides them rather than moving them. No source guideline
      asks for them in the non-technical document.

  - id: OR-22
    name: Prior sensitivity stays technical
    requirement: >
      Prior-data conflict diagnostics do not appear in the non-technical
      document.
    document: technical
    reader: [peer]
    source: [ISPOR7]
    check: manual
    realtime: false
    bos: fail
    bos_note: >
      The shift-from-priors bullet, in prior interquartile ranges, sits
      inside the headline bullets. Generated at analysis.jl lines 2359-2365.

  - id: OR-23
    name: Component decomposition stays technical
    requirement: >
      Per-stream or per-component decompositions do not appear in the
      non-technical document, beyond a link.
    document: technical
    reader: [peer]
    source: [ISPOR7]
    check: manual
    realtime: false
    bos: pass
    bos_note: >
      Fails on main, where the per-stream reproduction number is a summary
      section. PR 782 replaces it with a link, which satisfies this.
